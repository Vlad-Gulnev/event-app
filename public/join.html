<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход команды — Кейс-чемпионат</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand">Координационный центр · ЯрГУ им. П.Г. Демидова</div>
    <h1>Кейс-чемпионат для студентов</h1>
  </div>
</header>

<main class="container">
  <div class="card" id="card">Загрузка...</div>
</main>

<footer class="site-footer">
  Координационный центр · ЯрГУ им. П.Г. Демидова
</footer>

<script>
  var params = new URLSearchParams(window.location.search);
  var token  = params.get('token');
  var teamId = params.get('team');
  var card   = document.getElementById('card');

  if (token && teamId) {
    fetch('/api/teams')
      .then(function(r) { return r.json(); })
      .then(function(teams) {
        var team = null;
        for (var i = 0; i < teams.length; i++) {
          if (String(teams[i].id).trim() === String(teamId).trim() &&
              String(teams[i].token).trim() === String(token).trim()) {
            team = teams[i];
            break;
          }
        }
        if (!team) {
          card.innerHTML = '<h2>Команда не найдена</h2>' +
            '<p>Обратитесь к организатору чемпионата.</p>';
          return;
        }
        card.innerHTML =
          '<h2>Привет, ' + team.name + '!</h2>' +
          '<p>Ваша команда зарегистрирована. Когда будете готовы — начинайте первый тур.</p>' +
          '<p class="badge">Команда #' + team.id + '</p>' +
          '<p style="margin-top: 20px;">' +
            '<a class="btn btn-primary" href="/play.html?team=' + team.id + '&token=' + team.token + '">' +
              'Начать Тур 1. Правовой щит →' +
            '</a>' +
          '</p>';
      })
      .catch(function(err) {
        card.innerHTML = '<h2>Ошибка</h2><p>' + err + '</p>';
      });
  } else {
    card.innerHTML =
      '<h2>Регистрация команды</h2>' +
      '<p>Это страница организатора. Введите название команды, чтобы зарегистрировать её в чемпионате.</p>' +
      '<label for="name">Название команды</label>' +
      '<input id="name" type="text" placeholder="Например: Правоведы" />' +
      '<button class="btn btn-primary" onclick="register()">Зарегистрировать</button>' +
      '<div id="result"></div>';
  }

  function register() {
    var name = document.getElementById('name').value.trim() || 'Без названия';
    fetch('/api/teams', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name })
    })
    .then(function(r) { return r.json(); })
    .then(function(team) {
      document.getElementById('result').innerHTML =
        '<div class="msg ok">Команда зарегистрирована</div>' +
        '<p><b>' + team.name + '</b></p>' +
        '<p class="badge">Токен: ' + team.token + '</p>' +
        '<p style="margin-top: 16px;">' +
          '<a class="btn btn-secondary" href="/join.html?token=' + team.token + '&team=' + team.id + '">' +
            'Открыть страницу команды (для QR) →' +
          '</a>' +
        '</p>';
    });
  }
</script>

</body>
</html>
