<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админка чемпионата</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand">Координационный центр · ЯрГУ им. П.Г. Демидова</div>
    <h1>Админка чемпионата</h1>
  </div>
</header>

<main class="container wide">

  <div class="card">
    <p style="color: var(--muted); font-size: 14px;">Обновляется автоматически каждые 5 секунд.</p>

    <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0;">
      <label for="tour" style="margin: 0;">Тур:</label>
      <select id="tour" style="max-width: 320px; margin: 0;">
        <option value="1">Тур 1. Правовой щит</option>
        <option value="2">Тур 2. Психологический иммунитет</option>
        <option value="3">Тур 3. Контент-баттл</option>
        <option value="4">Тур 4. Алгоритм действий</option>
      </select>
      <button class="btn btn-secondary" onclick="load()">Обновить</button>
      <button class="btn btn-secondary" onclick="exportCSV()">Экспорт CSV</button>
      <button class="btn btn-danger" onclick="resetTour()">Сбросить ответы тура</button>
    </div>

    <table class="table" id="tbl">
      <thead>
        <tr>
          <th>#</th><th>Команда</th><th>Токен</th><th>Ответов</th><th>Баллы</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</main>

<footer class="site-footer">
  Координационный центр · ЯрГУ им. П.Г. Демидова
</footer>

<script>
  var currentData = null;

  function load() {
    var tour = document.getElementById('tour').value;
    fetch('/api/admin/summary?tour=' + tour)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        currentData = data;
        render(data);
      });
  }

  function render(data) {
    var tbody = document.querySelector('#tbl tbody');
    tbody.innerHTML = '';
    var teams = data.teams.slice().sort(function(a, b) { return b.points - a.points; });
    var max = teams.length > 0 ? teams[0].points : 0;

    teams.forEach(function(t, i) {
      var tr = document.createElement('tr');
      if (t.points === max && max > 0) tr.className = 'leader';
      tr.innerHTML =
        '<td>' + (i + 1) + '</td>' +
        '<td>' + t.name + '</td>' +
        '<td>' + t.token + '</td>' +
        '<td>' + t.answered + '</td>' +
        '<td><span class="badge ok">' + t.points + ' / ' + t.maxPoints + '</span></td>';
      tbody.appendChild(tr);
    });

    if (teams.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5">Нет команд</td></tr>';
    }
  }

  function exportCSV() {
    if (!currentData) return;
    var rows = [['Место', 'Команда', 'Токен', 'Ответов', 'Баллы']];
    var teams = currentData.teams.slice().sort(function(a, b) { return b.points - a.points; });
    teams.forEach(function(t, i) {
      rows.push([i + 1, t.name, t.token, t.answered, t.points + '/' + t.maxPoints]);
    });
    var csv = rows.map(function(r) { return r.join(';'); }).join('\n');
    var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tour-' + currentData.tour + '-results.csv';
    a.click();
  }

  function resetTour() {
    var tour = document.getElementById('tour').value;
    if (!confirm('Удалить ВСЕ ответы тура ' + tour + '? Это нельзя отменить.')) return;
    fetch('/api/admin/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tour: Number(tour) })
    })
    .then(function() { load(); });
  }

  load();
  setInterval(load, 5000);
</script>

</body>
</html>
