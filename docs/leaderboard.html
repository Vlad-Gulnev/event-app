<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Турнирная таблица — Кейс-чемпионат</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: 'Segoe UI', -apple-system, Arial, sans-serif;
    background: linear-gradient(135deg, #0a1628 0%, #0f2942 100%);
    color: #fff;
    overflow: hidden;
  }
  .header {
    padding: 24px 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid rgba(255,255,255,0.08);
  }
  .header h1 {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #fff, #7cc5f0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .brand {
    font-size: 15px;
    color: rgba(255,255,255,0.5);
    text-align: right;
    line-height: 1.4;
  }
  .header .brand .top {
    color: rgba(255,255,255,0.8);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .board {
    padding: 24px 60px;
    max-height: calc(100vh - 200px);
    overflow: hidden;
  }
  .team-row {
    display: grid;
    grid-template-columns: 90px 90px 1fr 220px;
    align-items: center;
    gap: 20px;
    padding: 16px 28px;
    margin-bottom: 12px;
    background: rgba(255,255,255,0.04);
    border-radius: 16px;
    border: 2px solid transparent;
    transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    font-size: 26px;
  }
  .team-row.leader {
    background: linear-gradient(90deg, rgba(255,215,0,0.18), rgba(255,215,0,0.04));
    border-color: rgba(255,215,0,0.6);
    box-shadow: 0 0 30px rgba(255,215,0,0.15);
  }
  .team-row.moved-up {
    animation: pulse-up 0.8s ease;
  }
  @keyframes pulse-up {
    0% { transform: translateX(-10px); box-shadow: 0 0 0 0 rgba(79,195,247,0.6); }
    100% { transform: translateX(0); box-shadow: 0 0 0 20px rgba(79,195,247,0); }
  }
  .team-row .place {
    font-size: 38px;
    font-weight: 900;
    color: #ffd700;
    text-align: center;
  }
  .team-row .avatar {
    font-size: 46px;
    text-align: center;
  }
  .team-row .name {
    font-size: 28px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .team-row .name .color-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .team-row .score {
    font-size: 38px;
    font-weight: 900;
    text-align: right;
    color: #4fc3f7;
    letter-spacing: -1px;
  }
  .team-row .score small {
    font-size: 20px;
    color: rgba(255,255,255,0.4);
    font-weight: 400;
    margin-left: 4px;
  }
  .footer {
    position: fixed;
    bottom: 16px;
    left: 60px;
    right: 60px;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: rgba(255,255,255,0.35);
  }
  .footer .live-dot {
    display: inline-block;
    width: 8px; height: 8px;
    background: #4fc3f7;
    border-radius: 50%;
    margin-right: 8px;
    animation: blink 1.5s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    font-size: 24px;
    color: rgba(255,255,255,0.4);
  }
  @media (max-width: 1200px) {
    .header h1 { font-size: 28px; }
    .team-row { grid-template-columns: 60px 60px 1fr 140px; padding: 12px 20px; font-size: 20px; }
    .team-row .place { font-size: 28px; }
    .team-row .avatar { font-size: 34px; }
    .team-row .name { font-size: 22px; }
    .team-row .score { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🏆 Турнирная таблица</h1>
  <div class="brand">
    <div class="top">Координационный центр</div>
    <div>ЯрГУ им. П.Г. Демидова</div>
  </div>
</div>

<div class="board" id="board">
  <div class="empty-state">Загрузка результатов…</div>
</div>

<div class="footer">
  <div><span class="live-dot"></span><span id="status">Подключение…</span></div>
  <div id="updated">—</div>
</div>

<script>
var prevRank = {};
var tick = 0;

function colorForTeam(team) {
  if (team.color) return team.color;
  // Палитра по caseId — чтобы всегда был стабильный цвет
  var palette = ['#157fc4', '#c8102e', '#2e7d32', '#b58b2a', '#7b1fa2', '#0288d1', '#d84315', '#5d4037'];
  return palette[(team.id - 1) % palette.length];
}

function emojiForTeam(team) {
  if (team.emoji) return team.emoji;
  var pool = ['🦅', '🐺', '🦁', '🐉', '🐻', '🦊', '🐯', '🦌', '🐗', '🦉'];
  return pool[(team.id - 1) % pool.length];
}

function renderBoard(teams) {
  var board = document.getElementById('board');

  if (!teams.length) {
    board.innerHTML = '<div class="empty-state">Пока нет команд. Зарегистрируйте их через <b>join.html</b>.</div>';
    return;
  }

  // Сортировка по общему баллу
  var sorted = teams.slice().sort(function(a, b) { return (b.grand || 0) - (a.grand || 0); });

  // Считаем новое распределение позиций
  var newRank = {};
  sorted.forEach(function(t, i) { newRank[t.id] = i; });

  var html = '';
  sorted.forEach(function(t, i) {
    var place = i + 1;
    var medal = place === 1 ? '🥇' : place === 2 ? '🥈' : place === 3 ? '🥉' : place;
    var isLeader = place === 1 && (t.grand || 0) > 0;
    var movedUp = prevRank[t.id] !== undefined && prevRank[t.id] > newRank[t.id];

    html += '<div class="team-row' + (isLeader ? ' leader' : '') + (movedUp ? ' moved-up' : '') + '" data-id="' + t.id + '">' +
      '<div class="place">' + medal + '</div>' +
      '<div class="avatar">' + emojiForTeam(t) + '</div>' +
      '<div class="name"><span class="color-dot" style="background:' + colorForTeam(t) + ';"></span>' + t.name + '</div>' +
      '<div class="score">' + (t.grand || 0) + '<small>балл.</small></div>' +
    '</div>';
  });

  board.innerHTML = html;

  // Звук при смене первой позиции
  if (prevRank._leader !== undefined && prevRank._leader !== sorted[0].id) {
    playDing();
  }
  prevRank._leader = sorted[0].id;
  prevRank = Object.assign({}, newRank, { _leader: sorted[0].id });

  document.getElementById('updated').textContent = 'Обновлено: ' + new Date().toLocaleTimeString('ru-RU');
}

// Звук через WebAudio
var audioCtx = null;
function playDing() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.4);
  } catch (e) {}
}

function loadData() {
  fetch('/api/admin/all')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var teams = data.teams.map(function(t) {
        return {
          id: t.id,
          name: t.name,
          emoji: t.emoji,
          color: t.color,
          grand: t.grand || 0
        };
      });
      renderBoard(teams);
      document.getElementById('status').textContent = 'Прямой эфир · ' + teams.length + ' команд';
    })
    .catch(function() {
      document.getElementById('status').textContent = 'Нет связи с сервером';
    });
}

loadData();
setInterval(loadData, 3000);

// Первое касание — разрешает звук в браузере
document.addEventListener('click', function() {
  if (!audioCtx) playDing();
}, { once: true });
</script>

</body>
</html>
