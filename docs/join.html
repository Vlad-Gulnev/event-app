<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход команды</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand">Координационный центр · ЯрГУ им. П.Г. Демидова</div>
    <h1>Кейс-чемпионат для студентов</h1>
  </div>
</header>

<main class="container">
  <div class="card" id="card">Загрузка...</div>
</main>

<footer class="site-footer">Координационный центр · ЯрГУ им. П.Г. Демидова</footer>

<script>
  var CASES = {
    1: 'Переписка в мессенджере',
    2: 'Пост в соцсети',
    3: 'Подозрительный предмет в вузе',
    4: 'Лёгкий заработок'
  };

  var params = new URLSearchParams(location.search);
  var token  = params.get('token');
  var teamId = params.get('team');
  var card   = document.getElementById('card');

  // Сценарий 1: пришли по QR с токеном
  if (token && teamId) {
    fetch('/api/teams/by-token?token=' + encodeURIComponent(token))
      .then(function(r) {
        if (!r.ok) throw new Error('not found');
        return r.json();
      })
      .then(function(team) {
        if (!team || String(team.id) !== String(teamId)) {
          card.innerHTML = '<h2>Команда не найдена</h2><p>Обратитесь к организатору.</p>';
          return;
        }
        var caseTitle = CASES[team.caseId] || '—';
        card.innerHTML =
          '<h2>Привет, ' + team.name + '!</h2>' +
          '<p>Команда #' + team.id + '. Ваш ситуационный кейс: <b>' + caseTitle + '</b>.</p>' +
          '<p style="margin-top:20px;"><a class="btn btn-primary" href="menu.html?team=' + team.id + '&token=' + team.token + '">Перейти в меню туров →</a></p>';
      })
      .catch(function() {
        card.innerHTML = '<h2>Команда не найдена</h2><p>Обратитесь к организатору.</p>';
      });
  } else {
    // Сценарий 2: организатор регистрирует вручную
    card.innerHTML =
      '<h2>Регистрация команды</h2>' +
      '<p>Введите название команды — она сохранится на сервере.</p>' +
      '<label for="name">Название команды</label>' +
      '<input id="name" type="text" placeholder="Например: Правоведы" />' +
      '<button class="btn btn-primary" onclick="register()">Зарегистрировать</button>' +
      '<div id="result"></div>';
  }

  function register() {
    var name = document.getElementById('name').value.trim() || 'Без названия';
    var btn = event.target;
    btn.disabled = true;
    btn.textContent = 'Регистрация...';

    fetch('/api/teams', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name })
    })
      .then(function(r) { return r.json(); })
      .then(function(team) {
        var caseTitle = CASES[team.caseId] || '—';
        var base = location.origin + location.pathname.replace(/\/[^\/]*$/, '/');
        var link = base + 'menu.html?token=' + team.token + '&team=' + team.id;
        document.getElementById('result').innerHTML =
          '<div class="msg ok">Команда сохранена на сервере</div>' +
          '<p><b>' + team.name + '</b></p>' +
          '<p class="badge">Токен: ' + team.token + '</p>' +
          '<p>Ситуационный кейс: <b>' + caseTitle + '</b></p>' +
          '<p style="margin-top:16px;"><b>Ссылка для команды:</b></p>' +
          '<p style="font-size:13px; word-break:break-all;"><a href="' + link + '">' + link + '</a></p>' +
          '<p style="margin-top:12px;">' +
            '<a class="btn btn-secondary" href="' + link + '">Открыть страницу команды →</a>' +
          '</p>';
        btn.disabled = false;
        btn.textContent = 'Зарегистрировать ещё одну';
        document.getElementById('name').value = '';
      })
      .catch(function(err) {
        alert('Ошибка: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Зарегистрировать';
      });
  }
</script>

</body>
</html>
